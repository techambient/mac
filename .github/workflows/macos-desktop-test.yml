name: macOS Free Desktop UI Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  execute-desktop-test:
    runs-on: macos-latest 

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          npm init -y
          npm install playwright

      - name: Install Playwright Browser Binaries
        run: npx playwright install --with-deps

      - name: Configure macOS System Permissions
        run: |
          echo "Granting structural terminal automation privileges..."
          # Uses Apple's built-in utility instead of raw database modifications
          sudo tccutil reset ScreenCapture com.apple.Terminal || true
          sudo tccutil reset Accessibility com.apple.Terminal || true

      - name: Execute UI Tests on Active Window Server
        run: node tests/run_ui_test.js

      - name: Extract and Upload Visual Artifacts (Screenshots & Videos)
        if: always() # Ensures logs upload even if your test assertions fail
        uses: actions/upload-artifact@v4
        with:
          name: macos-gui-test-results
          path: |
            screenshots/
            videos/
