name: Live Interactive macOS Desktop Debugger

on:
  workflow_dispatch: # Interactive runtime trigger directly via Actions panel

jobs:
  interactive-desktop-session:
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Live Cloudflare VNC Session
        run: |
          echo "=== Configuring Local Desktop Admin User ==="
          sudo dscl . -passwd /Users/runner "MacDebug2026!" || true
          
          echo "=== Activating Apple Screen Sharing Server ==="
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpasswd -vncpasswd "MacDebug2026!" \
            -restart -agent -privs -all || true
          
          echo "=== Initializing Cloudflare Zero-Trust Tunnel ==="
          # Install Cloudflare's tunneling binaries natively via Homebrew
          brew install cloudflare/cloudflare/cloudflared
          
          echo "=========================================================="
          echo " LOOK AT THE LOG LINES BELOW FOR YOUR .trycloudflare.com URL"
          echo " Connect with Username: runner | Password: MacDebug2026!"
          echo "=========================================================="
          
          # Create an ephemeral quick tunnel binding the macOS VNC interface (port 5900)
          # Keeps the streaming channel socket open for up to 30 minutes (1800 seconds)
          cloudflared tunnel --url tcp://localhost:5900 &
          sleep 1800
