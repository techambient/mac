name: Live Interactive macOS Desktop Debugger

on:
  workflow_dispatch:

jobs:
  interactive-desktop-session:
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup User-Space TigerVNC Server
        run: |
          echo "=== Configuring Homebrew Security Variables ==="
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          
          echo "=== Tapping and Trusting Cloudflare Core Repositories ==="
          brew tap cloudflare/cloudflare
          brew trust cloudflare/cloudflare || true
          
          echo "=== Installing TigerVNC Binaries and Cloudflare ==="
          brew install tiger-vnc cloudflare/cloudflare/cloudflared
          
          echo "=== Injecting Homebrew Environment to Active Shell PATH ==="
          # This guarantees that the shell can immediately locate vncpasswd and vncserver
          eval "$(/opt/homebrew/bin/brew shellenv)"
          
          echo "=== Configuring VNC Password ==="
          mkdir -p ~/.vnc
          vncpasswd -f > ~/.vnc/passwd <<< "MacDebug2026!"
          chmod 600 ~/.vnc/passwd
          
          echo "=== Starting VNC Server on Display :1 (Port 5901) ==="
          vncserver :1 -geometry 1280x800 -localhost no || true
          
          echo "=== Giving the VNC Server Time to Bind Sockets ==="
          sleep 5
          
          # Diagnostic check: Verify port 5901 is actively listening
          sudo lsof -i :5901 || echo "⚠️ Warning: Port 5901 does not appear to be open yet!"
          
          echo "=========================================================="
          echo " LOOK AT THE LOG LINES BELOW FOR YOUR .trycloudflare.com URL"
          echo " Connect with Password: MacDebug2026!"
          echo "=========================================================="
          
          cloudflared tunnel --url tcp://127.0.0.1:5901 &
          sleep 1800
