name: Live Interactive macOS Desktop Debugger

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  interactive-desktop-session:
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Live Desktop Control Session
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          echo "=== Configuring Local Desktop Admin User ==="
          # 1. Assign a secure connection password for the local 'runner' profile
          sudo dscl . -passwd /Users/runner "MacDebug2026!"
          
          echo "=== Activating Apple Screen Sharing Server ==="
          # 2. Fire up the native macOS Remote Management service
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpasswd -vncpasswd "MacDebug2026!" \
            -restart -agent -privs -all
          
          echo "=== Initializing Secure Network Tunnel ==="
          # 3. Deploy and authenticate the network forwarding engine
          brew install ngrok
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          echo "=========================================================="
          echo " LOOK AT THE LOG LINES BELOW FOR YOUR NGROK TCP ADDRESS"
          echo " Connect with Username: runner | Password: MacDebug2026!"
          echo "=========================================================="
          
          # 4. Bind the tunnel to the VNC network interface port (5900)
          # Keeps the connection socket open for a maximum of 30 minutes (1800 seconds)
          ngrok tcp 5900 --log=stdout &
          sleep 1800
