name: Live Interactive macOS Desktop Debugger

on:
  workflow_dispatch:
    # This block defines the input field that appears when clicking the "Run workflow" button
    inputs:
      ngrok_token:
        description: 'Paste your Ngrok Authtoken here'
        required: true
        type: string

jobs:
  interactive-desktop-session:
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Live Desktop Control Session
        env:
          # Reads directly from your manual button input instead of the repository secrets block
          NGROK_AUTH_TOKEN: ${{ github.event.inputs.ngrok_token }}
        run: |
          echo "=== Configuring Local Desktop Admin User ==="
          sudo dscl . -passwd /Users/runner "MacDebug2026!" || true
          
          echo "=== Activating Apple Screen Sharing Server ==="
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpasswd -vncpasswd "MacDebug2026!" \
            -restart -agent -privs -all || true
          
          echo "=== Initializing Secure Network Tunnel ==="
          brew install ngrok
          
          # Clean execution gate to double-check that the manual text parameter isn't blank
          if [ -z "$NGROK_AUTH_TOKEN" ]; then
            echo "❌ ERROR: No Ngrok Authtoken provided in the prompt input field!"
            exit 1
          fi
          
          ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
          
          echo "=========================================================="
          echo " LOOK AT THE LOG LINES BELOW FOR YOUR NGROK TCP ADDRESS"
          echo " Connect with Username: runner | Password: MacDebug2026!"
          echo "=========================================================="
          
          # Bind the tunnel to the VNC network interface port (5900)
          ngrok tcp 5900 --log=stdout &
          sleep 1800
