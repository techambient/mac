name: Live Interactive macOS Desktop Debugger

on:
  workflow_dispatch:

jobs:
  interactive-desktop-session:
    runs-on: macos-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Live Cloudflare VNC Session
        run: |
          echo "=== Configuring Local Desktop Admin User ==="
          sudo dscl . -passwd /Users/runner "MacDebug2026!" || true
          
          echo "=== Activating Apple Screen Sharing Server ==="
          # 1. Enable remote management and assign privileges cleanly
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -privs -all || true
          
          # 2. Set the secure VNC authentication password using the correct flag syntax
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy yes -setvncpw "MacDebug2026!" || true
          
          # 3. Force a restart of the agent daemon to apply the new password profile
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent || true
          
          echo "=== Giving the VNC Server Time to Bind Sockets ==="
          sleep 5
          
          # Diagnostic check: Verify if the system is actively listening on port 5900
          sudo lsof -i :5900 || echo "⚠️ Warning: Port 5900 does not appear to be open yet!"
          
          echo "=== Initializing Cloudflare Zero-Trust Tunnel ==="
          brew install cloudflare/cloudflare/cloudflared
          
          echo "=========================================================="
          echo " LOOK AT THE LOG LINES BELOW FOR YOUR .trycloudflare.com URL"
          echo " Connect with Username: runner | Password: MacDebug2026!"
          echo "=========================================================="
          
          cloudflared tunnel --url tcp://127.0.0.1:5900 &
          sleep 1800
